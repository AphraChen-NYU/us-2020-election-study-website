name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Build static site
        run: pnpm build

      - name: Verify exported site content
        run: |
          grep -q 'aria-label="Primary navigation"' out/index.html
          grep -q 'Platform usage outcome measures' out/variable-operationalization/participation/index.html
          grep -q 'Chronological Feed (Guess et al., 2023)' out/variable-operationalization/participation/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site content
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site_url="${DEPLOYED_URL%/}"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            "${site_url}/?version=${GITHUB_SHA}" \
            --output deployed-home.html
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            "${site_url}/variable-operationalization/participation?version=${GITHUB_SHA}" \
            --output deployed-participation.html
          grep -q 'aria-label="Primary navigation"' deployed-home.html
          grep -q 'Platform usage outcome measures' deployed-participation.html
          grep -q 'Chronological Feed (Guess et al., 2023)' deployed-participation.html
